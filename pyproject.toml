[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jakana"
version = "1.0.0"
description = "The Jakana programming language"
requires-python = ">=3.11"

[project.scripts]
jakana = "jakana.cli:main"

[tool.setuptools.packages.find]
where = ["src"]